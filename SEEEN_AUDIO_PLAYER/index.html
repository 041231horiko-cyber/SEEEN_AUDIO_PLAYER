          <svg class="brand-caption" width="97" height="14" viewBox="0 0 97 14" aria-hidden="true"><text x="0" y="10" textLength="97" lengthAdjust="spacing">AUDIO PLAYER</text></svg>
        </h1>
        <div class="unit">EXHIBITION UNIT</div>
      </header>
      <section class="field" aria-label="ビジュアライザー">
        <div id="wave-frame" aria-hidden="true"><svg id="waves" aria-hidden="true" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
          <g id="rings"></g><circle r="2.4" fill="currentColor"/>
        </svg></div>
      </section>
      <section class="controls" aria-label="プレイヤー操作">
        <div class="caption"><small>CURRENT SOURCE</small><output id="now-playing">NONE</output></div>
        <section class="selector" aria-label="音源選択">
          <button type="button" data-track="bright-wide" aria-pressed="false">BRIGHT / WIDE</button>
          <button type="button" data-track="bright-narrow" aria-pressed="false">BRIGHT / NARROW</button>
          <button type="button" data-track="dark-wide" aria-pressed="false">DARK / WIDE</button>
          <button type="button" data-track="dark-narrow" aria-pressed="false">DARK / NARROW</button>
        </section>
        <button id="play-toggle" type="button" aria-label="再生する">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="play-icon" d="M5 2L22 12L5 22Z"/>
            <path class="pause-icon" d="M5 2H10V22H5ZM14 2H19V22H14Z"/>
          </svg>
        </button>
        <footer aria-label="再生ステータス">
          <div data-indicator="no"><i aria-hidden="true"></i><output id="playback-state" data-state="idle">IDLE</output></div>
          <div id="loop-status" data-indicator="yes"><i aria-hidden="true"></i><span>LOOP</span></div>
          <div data-indicator="pending"><i aria-hidden="true"></i><button id="offline-status" type="button" disabled>CHECKING</button></div>
        </footer>
        <p id="error-message" role="alert" hidden></p>
      </section>
      <span id="instruction" hidden></span><span id="live-announcement" class="sr" aria-live="polite"></span>
      <audio id="audio-player" preload="metadata" loop playsinline></audio>
    </main>
    </div>
    <div id="orientation-notice" role="status" aria-live="polite">
      <strong>LANDSCAPE REQUIRED</strong>
      <span>端末を横向きにしてください</span>
    </div>
    </div>
    <script>
      (function () {
        "use strict";
        var DESIGN_WIDTH = 667;
        var DESIGN_HEIGHT = 375;
        var shell = document.getElementById("app-shell");
        var stage = document.getElementById("app-stage");

        function updateStageScale() {
          var viewport = window.visualViewport;
          var styles;
          var availableWidth;
          var availableHeight;
          var scale;

          shell.style.left = (viewport ? viewport.offsetLeft : 0) + "px";
          shell.style.top = (viewport ? viewport.offsetTop : 0) + "px";
          shell.style.width = (viewport ? viewport.width : window.innerWidth) + "px";
          shell.style.height = (viewport ? viewport.height : window.innerHeight) + "px";
          styles = window.getComputedStyle(shell);
          availableWidth = shell.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
          availableHeight = shell.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
          scale = Math.min(availableWidth / DESIGN_WIDTH, availableHeight / DESIGN_HEIGHT);
          stage.style.left = (parseFloat(styles.paddingLeft) + availableWidth / 2) + "px";
          stage.style.top = (parseFloat(styles.paddingTop) + availableHeight / 2) + "px";
          stage.style.setProperty("--stage-scale", String(Math.max(scale, 0)));
        }

        window.addEventListener("resize", updateStageScale);
        window.addEventListener("orientationchange", updateStageScale);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", updateStageScale);
          window.visualViewport.addEventListener("scroll", updateStageScale);
        }
        updateStageScale();
      }());
    </script>
